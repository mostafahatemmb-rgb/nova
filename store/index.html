<style>

function tr(s){if(LG!="ar"||!s)return s;const t=s.trim();if(!t)return s;let o=t;if(AR[t]!==undefined)o=AR[t];else for(const[r,v]of PAT)if(r.test(t)){o=t.replace(r,v);break}

{id:1,name:"Black Overshirt",price:1290},{id:2,name:"Classic Tee",price:450},{id:3,name:"Slim Chinos",price:890},{id:4,name:"Knit Polo",price:650},

let OFFERS=[],NOTICE="",ack=false,PAY={cod:true},SHIP={def:50,fees:{}},pay="cod",lastPay="",lastTot=0,P=DEF,C=ld("nv_c",[]),O=ld("nv_o",[]),W="",done=false;

<div><h3 style="margin-bottom:1rem">Delivery details</h3><div class="f"><input id="cn" placeholder="Full name" autocomplete="name"><select id="cg" onchange="rcpt()" style="width:100%" aria-label="Governorate"><option value="">Governorate</option>${GOV.map(g=>`<option value="${g}">${g}</option>`).join("")}</select><input id="ca" placeholder="Address" autocomplete="street-address"><input id="cp" placeholder="Phone number" type="tel" autocomplete="tel"><input id="cp2" placeholder="Another phone number" type="tel"></div><div id="rc">${rcptBlock()}</div><div id="pb">${payBlock()}</div><button class="btn" id="ob" style="width:100%;margin-top:1rem" onclick="order()">Confirm order</button></div></div></section>`}

return`<section class="w"><a href="#shop" class="mu" style="text-decoration:none;color:var(--mu)">← Back to shop</a><div class="cl" style="margin-top:1.5rem"><div class="ph" style="max-width:520px">${img(p)}</div><div><h2 style="margin-bottom:.6rem">${esc(p.name)}</h2><p style="font-size:1.4rem;margin:0 0 1.5rem">${price(p)}</p>${cs.length?`<h3 class="lb">Color</h3>${ch("cc",cs,p.offColors||[])}`:""}<h3 class="lb">Size</h3>${ch("cs",ss,p.offSizes||[])}${g?`<button class="btn" style="width:100%;margin-top:1rem" disabled>Sold out</button>`:`<button class="btn" style="width:100%;margin-top:1rem" onclick="add('${p.id}')">Add to cart</button>`}</div></div></section>`}
const noCod=()=>PAY.cod===false&&(PAY.insta||PAY.wallet);
const payList=()=>[noCod()?"":"Cash on delivery",PAY.insta?"InstaPay":"",PAY.wallet?(PAY.walletName||"Digital wallet"):""].filter(Boolean);
const payName=k=>k=="insta"?"InstaPay":k=="wallet"?(PAY.walletName||"Digital wallet"):"Cash on delivery";
const payInfo=(k,a)=>`Send ${fmt(a)} to ${k=="insta"?"InstaPay":esc(PAY.walletName||"our wallet")}: <b style="color:#fff">${esc(k=="insta"?PAY.insta:PAY.wallet)}</b>. After ordering, send us the payment screenshot on WhatsApp.`;
function payBlock(){const o=[];if(!noCod())o.push("cod");if(PAY.insta)o.push("insta");if(PAY.wallet)o.push("wallet");if(!o.includes(pay))pay=o[0];
return`<h3 style="margin:1.2rem 0 .6rem">Payment</h3><div class="f" style="gap:.4rem">${o.map(k=>`<label style="display:flex;gap:.6rem;align-items:center;border:1px solid ${pay==k?"#fff":"#444"};padding:.7rem;cursor:pointer"><input type="radio" name="pm" ${pay==k?"checked":""} onchange="pay='${k}';$('#pb').innerHTML=payBlock()" style="width:auto;padding:0;accent-color:#fff"> ${payName(k)}</label>`).join("")}</div>${pay!="cod"?`<p style="color:var(--mu);font-size:.9rem">${payInfo(pay,grand())}</p>`:""}`}
const offersBar=()=>OFFERS.length?`<div class="offs">${OFFERS.map(o=>`<a href="#shop" class="off">${o.pct?`<b>${o.pct}% OFF</b>`:""}${esc(o.name)}${o.text?" · "+esc(o.text):""}</a>`).join("")}</div>`:"";
function showNotice(){const m=document.createElement("div");m.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:30;padding:1rem";m.innerHTML=`<div role="dialog" aria-modal="true" style="background:#000;border:1px solid #fff;max-width:420px;padding:1.5rem"><h3 style="margin-bottom:.8rem">Before you order</h3><p style="white-space:pre-line">${esc(NOTICE)}</p><div class="r" style="margin-top:1.2rem"><button class="btn o" id="nx">Back</button><button class="btn" id="nk">Continue</button></div></div>`;document.body.appendChild(m);$("#nx").onclick=()=>m.remove();$("#nk").onclick=()=>{m.remove();ack=true;order()}}
async function boot(){try{const d=await(await fetch("/api/products")).json();if(d.wa)W=d.wa;OFFERS=d.offers||[];NOTICE=d.notice||"";PAY=d.payment||{cod:true};SHIP=d.shipping||SHIP;if(d.products&&d.products.length)P=d.products;render()}catch(e){}}
function saveOrder(oid,n,p,c,a,items){try{fetch("/api/order",{method:"POST",headers:{"Content-Type":"application/json"},keepalive:true,body:JSON.stringify({oid,name:n,phone:p,city:c,address:a,items:items.map(i=>({id:i.id,q:i.q}))})})}catch(e){}}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});render();boot();
</script></body></html>
