<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nova Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;600&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--mu:#9b9b9b;--ln:#2a2a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}body{margin:0;background:#000;color:#fff;font:400 16px/1.5 Manrope,system-ui,sans-serif;padding:1.5rem 5vw 4rem;max-width:960px;margin-inline:auto}
h1,h2,h3{font-family:Syne,Impact,sans-serif;margin:0}h1{letter-spacing:.3em;font-size:1.5rem}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ln);padding-bottom:1rem;margin-bottom:1.5rem}
.btn{background:#fff;color:#000;border:1px solid #fff;padding:.6rem 1.1rem;font:600 .9rem Manrope,sans-serif;cursor:pointer}.btn.o{background:none;color:#fff}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
input,select,textarea{background:#000;color:#fff;border:1px solid #444;padding:.6rem;font:inherit;border-radius:0;min-width:0}
.tabs{display:flex;gap:.6rem;margin-bottom:1.5rem;flex-wrap:wrap}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem}.st div{border:1px solid var(--ln);padding:1.1rem}.st b{display:block;font:800 1.6rem Syne,sans-serif}
.br{display:grid;grid-template-columns:150px 1fr 110px;gap:.8rem;align-items:center;margin:.5rem 0;font-size:.9rem}.br i{display:block;height:10px;background:#fff}
.row{flex-wrap:wrap;display:flex;gap:.6rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--ln)}.row input:first-child,.row span:first-child{flex:1}.row input[type=number]{width:110px}
.f{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.5rem}.mu{color:var(--mu)}
.tb{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:.7rem 1.2rem;font-weight:600}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.6rem 1.5rem;margin-bottom:1rem}
.pc{border:1px solid var(--ln);padding:1rem;margin-bottom:1rem}.pc.so{opacity:.65}.lb2{font-size:.85rem;color:var(--mu);margin:.9rem 0 .4rem}.tg{display:inline-flex;border:1px solid #fff;margin:0 .4rem .4rem 0}.tg button{background:#fff;color:#000;border:0;padding:.4rem .8rem;font:600 .85rem Manrope,sans-serif;cursor:pointer}.tg a{padding:.4rem .6rem;text-decoration:none;color:#fff}.tg.off{border-color:#555}.tg.off button{background:#000;color:#777;text-decoration:line-through}.tg.off a{color:#777}
.ar body,.ar h2,.ar h3,.ar p,.ar .btn,.ar button,.ar input,.ar select,.ar textarea,.ar .chip,.ar .cats a,.ar .off,.ar .lgb{font-family:Cairo,system-ui,sans-serif}
</style></head><body>
<div class="top"><h1>NOVA ADMIN</h1><span class="mu">Private</span><button class="btn o" id="lgb" style="padding:.35rem .8rem"></button></div>
<div id="app"><p class="mu">Loading…</p></div>
<script>
let LG="";try{LG=localStorage.getItem("nv_lang")||""}catch(e){}
const LOC=LG=="ar"?"ar-EG-u-nu-latn":"en-US";
const AR={"Private": "خاص", "Loading…": "جارٍ التحميل…", "Sales": "المبيعات", "Notes, offers & payment": "الملاحظات والعروض والدفع", "Products": "المنتجات", "Month": "الشهر", "Resets on the 1st of every month. Pick a past month to see its history.": "تبدأ المبيعات من جديد في أول كل شهر. اختر شهرًا سابقًا لعرض سجله.", "Total sales": "إجمالي المبيعات", "Total orders": "إجمالي الطلبات", "Average order": "متوسط الطلب", "No previous month yet": "لا يوجد شهر سابق بعد", "Best sellers": "الأكثر مبيعًا", "No orders in this month yet.": "لا توجد طلبات في هذا الشهر بعد.", "By category": "حسب الفئة", "No sales this month.": "لا توجد مبيعات هذا الشهر.", "No category": "بدون فئة", "Orders this month": "طلبات هذا الشهر", "Customer name": "اسم العميل", "Quantity": "الكمية", "Log order": "تسجيل طلب", "Delete": "حذف", "No orders yet. Customer orders appear here by themselves.": "لا توجد طلبات بعد. تظهر طلبات العملاء هنا تلقائيًا.", "Notification before checkout": "إشعار قبل إتمام الطلب", "Customers see this in a pop-up when they press the order button and must tap Continue. Leave it empty to turn it off.": "يظهر هذا الإشعار للعميل في نافذة عند الضغط على زر الطلب ويجب أن يضغط متابعة. اتركه فارغًا لإيقافه.", "Notification text": "نص الإشعار", "Save notification": "حفظ الإشعار", "Offers on products": "عروض على المنتجات", "Offers show above the big brand name on the home page. Add a % off to lower that product's price in the store.": "تظهر العروض فوق اسم العلامة الكبير في الصفحة الرئيسية. أضف نسبة خصم لتخفيض سعر المنتج في المتجر.", "Offer text, e.g. Summer sale": "نص العرض، مثل: تخفيضات الصيف", "% off": "% خصم", "Add offer": "إضافة عرض", "Add products first.": "أضف منتجات أولًا.", "Remove": "إزالة", "No offers yet.": "لا توجد عروض بعد.", "Deleted product": "منتج محذوف", "Payment methods": "طرق الدفع", "Customers pick one at checkout. InstaPay and wallet are manual: the customer sends the money to the details below, then sends you the screenshot on WhatsApp. Leave a field empty to turn that method off.": "يختار العميل واحدة عند إتمام الطلب. الدفع عبر إنستاباي والمحفظة يدوي: يحوّل العميل المبلغ إلى البيانات أدناه ثم يرسل لك صورة التحويل على واتساب. اترك الحقل فارغًا لإيقاف الطريقة.", "Cash on delivery": "الدفع عند الاستلام", "InstaPay address or number": "عنوان أو رقم إنستاباي", "Wallet number (Vodafone Cash, etc.)": "رقم المحفظة (فودافون كاش وغيرها)", "Wallet number": "رقم المحفظة", "Wallet name, e.g. Vodafone Cash": "اسم المحفظة، مثل: فودافون كاش", "Wallet name": "اسم المحفظة", "Save payment methods": "حفظ طرق الدفع", "Shipping fee": "رسوم الشحن", "Cairo has its own fee. Every other governorate has the same fee.": "للقاهرة رسوم خاصة بها. باقي المحافظات لها نفس الرسوم.", "Cairo (EGP)": "القاهرة (ج.م)", "All other governorates (EGP)": "باقي المحافظات (ج.م)", "Save shipping": "حفظ الشحن", "Saved": "تم الحفظ", "Add product": "إضافة منتج", "Product name": "اسم المنتج", "Price (EGP)": "السعر (ج.م)", "Category": "الفئة", "Sizes, comma separated (S, M, L)": "المقاسات مفصولة بفواصل (S, M, L)", "Colors, comma separated (Black, White)": "الألوان مفصولة بفواصل (أسود، أبيض)", "Photo URL (optional)": "رابط الصورة (اختياري)", "No products yet.": "لا توجد منتجات بعد.", "Load starter catalog": "تحميل منتجات تجريبية", "Each product has its own sizes and colors. Tap a size or color to mark it unavailable (crossed out). Tap it again to make it available. Tick Sold out to hide the Add to cart button.": "لكل منتج مقاساته وألوانه الخاصة. اضغط على مقاس أو لون لتعطيله (يظهر مشطوبًا). اضغط مرة أخرى لإتاحته. فعّل «نفد المخزون» لتعطيل زر الإضافة إلى السلة.", "Name": "الاسم", "Price in EGP": "السعر بالجنيه", "Photo URL": "رابط الصورة", "Sizes": "المقاسات", "Colors": "الألوان", "Add size": "إضافة مقاس", "Add color": "إضافة لون", "Add": "إضافة", "Sold out": "نفد المخزون", "Delete product": "حذف المنتج", "Categories": "الفئات", "New category name": "اسم الفئة الجديدة", "Add category": "إضافة فئة", "No categories yet.": "لا توجد فئات بعد.", "Delete category": "حذف الفئة", "Enter the product name and price": "أدخل اسم المنتج وسعره", "Already added": "تمت إضافته بالفعل", "Write the offer text or a discount": "اكتب نص العرض أو نسبة الخصم", "Wrong PIN, or the Vercel environment variables are missing.": "الرقم السري غير صحيح أو إعدادات Vercel ناقصة.", "Enter admin PIN": "أدخل الرقم السري للإدارة", "Delete this product?": "حذف هذا المنتج؟"};
const PAT=[[/^(.+) \(current\)$/,"$1 (الحالي)"],[/^(\d+) sold$/,"$1 مباع"],[/^([↗↘]) (\d+)% vs last month$/,"$1 $2% مقارنة بالشهر الماضي"],[/^(.+) last month$/,"$1 الشهر الماضي"],[/^Solid line: (.+)\. Dotted line: (.+)\.$/,"الخط المتصل: $1. الخط المنقط: $2."],[/^Could not save: (.*)$/,"تعذر الحفظ: $1"]];
const GL=[[/(\d+)% (?:OFF|off)/g,"خصم $1%"],[/\bSize (?=\S)/g,"المقاس "],[/\bour wallet\b/g,"محفظتنا"],[/\bEGP\b/g,"ج.م"]];
function tr(s){if(LG!="ar"||!s)return s;const t=s.trim();if(!t)return s;let o=t;if(AR[t]!==undefined)o=AR[t];else for(const[r,v]of PAT)if(r.test(t)){o=t.replace(r,v);break}
for(const[r,v]of GL)o=o.replace(r,v);return o===t?s:s.replace(t,()=>o)}
function trNode(n){if(n.nodeType==3){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}
if(n.nodeType!=1||n.tagName=="SCRIPT"||n.tagName=="STYLE"||n.hasAttribute("data-nt"))return;
for(const a of["placeholder","aria-label","title"])if(n.hasAttribute(a)){const v=tr(n.getAttribute(a));if(v!==n.getAttribute(a))n.setAttribute(a,v)}
n.childNodes.forEach(trNode)}
function setLang(l){try{localStorage.setItem("nv_lang",l)}catch(e){}location.reload()}
(function(){const b=document.getElementById("lgb");if(b){b.textContent=LG=="ar"?"English":"العربية";b.onclick=()=>setLang(LG=="ar"?"en":"ar")}
if(LG=="ar"){const h=document.documentElement;h.dir="rtl";h.lang="ar";h.classList.add("ar");trNode(document.body);new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(trNode))).observe(document.body,{childList:true,subtree:true})}
if(!LG){const m=document.createElement("div");m.setAttribute("data-nt","1");m.style.cssText="position:fixed;inset:0;background:#000;z-index:100;display:grid;place-items:center;text-align:center;padding:1rem";
m.innerHTML=`<div><div style="font:800 2.2rem Syne,Impact,sans-serif;letter-spacing:.3em;margin-bottom:2.5rem">NOVA</div><p style="color:#9b9b9b;margin-bottom:1.5rem">Choose your language · اختر لغتك</p><div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="setLang('en')">English</button><button class="btn" onclick="setLang('ar')" style="font-family:Cairo,system-ui,sans-serif">العربية</button></div></div>`;document.body.appendChild(m)}})();
const DEF=[["Black Overshirt",1290],["Classic Tee",450],["Slim Chinos",890],["Knit Polo",650],["Zip Hoodie",1090],["Denim Jacket",1490],["Linen Shirt",790],["Bomber Jacket",1390]];
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const fmt=n=>Number(n).toLocaleString("en-US")+" EGP";
let db,PR=[],OR=[],CA=[],OF=[],ST=[],mo=null,tab="sales";
function toast(m){const t=document.createElement("div");t.className="tb";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
async function load(){const a=await db.collection("products").get(),b=await db.collection("orders").get(),cc=await db.collection("categories").get(),oo=await db.collection("offers").get(),ss=await db.collection("settings").get();OF=oo.docs.map(d=>({id:d.id,...d.data()}));ST=ss.docs.map(d=>({id:d.id,...d.data()}));CA=cc.docs.map(d=>({id:d.id,...d.data()}));mo=mo||mk(Date.now());
PR=a.docs.map(d=>({id:d.id,...d.data()}));OR=b.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>y.at-x.at);render()}
async function run(f){try{await f();await load()}catch(e){toast("Could not save: "+(e.message||e.code))}}
const fk=n=>n>=1000?(n/1000)+"K":n;
const mk=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const mname=k=>new Date(k+"-01T12:00:00").toLocaleDateString(LOC,{month:"long",year:"numeric"});
const inMo=k=>OR.filter(o=>mk(o.at)==k);
const pm=k=>{const[y,m]=k.split("-").map(Number);return mk(new Date(y,m-2,1))};
function months(){return[...new Set([mk(Date.now()),...OR.map(o=>mk(o.at))])].sort().reverse()}
function mbar(){return`<div class="f"><select onchange="mo=this.value;render()" aria-label="Month">${months().map(k=>`<option value="${k}" ${k==mo?"selected":""}>${mname(k)}${k==mk(Date.now())?" (current)":""}</option>`).join("")}</select><span class="mu" style="align-self:center">Resets on the 1st of every month. Pick a past month to see its history.</span></div>`}
function chart(){
const[y,m]=mo.split("-").map(Number),n=new Date(y,m,0).getDate(),pk=pm(mo);
const bk=k=>{const a=Array(n).fill(0);let c=0,t=0;const ids=new Set();inMo(k).forEach(o=>{const i=new Date(o.at).getDate()-1;if(i<n)a[i]+=o.total;ids.add(o.oid||o.id);t+=o.total});return{a,c:ids.size,t}};
const c=bk(mo),p=bk(pk),W=640,H=220,L=48,T=12,B=26,mg=Math.max(...c.a,...p.a,1),mag=10**Math.floor(Math.log10(mg)),mx=Math.ceil(mg/mag)*mag;
const X=i=>L+i*(W-L-8)/(n-1),Y=v=>T+(1-v/mx)*(H-T-B),cl=y=>Math.min(y,H-B);
const pth=a=>{const q=a.map((v,i)=>[X(i),Y(v)]);let d="M"+q[0];for(let i=0;i<q.length-1;i++){const a0=q[i-1]||q[i],a1=q[i],a2=q[i+1],a3=q[i+2]||a2;d+=`C${a1[0]+(a2[0]-a0[0])/6},${cl(a1[1]+(a2[1]-a0[1])/6)} ${a2[0]-(a3[0]-a1[0])/6},${cl(a2[1]-(a3[1]-a1[1])/6)} ${a2}`}return d};
const ch=p.t?Math.round((c.t-p.t)/p.t*100):null,cur=pth(c.a),mn=new Date(y,m-1,1).toLocaleDateString(LOC,{month:"short"}),dt=i=>(i+1)+" "+mn;
return `<div class="st"><div><span class="mu">Total sales</span><b>${fmt(c.t)}</b><span style="color:${ch==null?"var(--mu)":ch>=0?"#3ecf8e":"#ff6b6b"}">${ch==null?"No previous month yet":(ch>=0?"\u2197 ":"\u2198 ")+Math.abs(ch)+"% vs last month"}</span></div><div><span class="mu">Total orders</span><b>${c.c}</b><span class="mu">${p.c} last month</span></div><div><span class="mu">Average order</span><b>${c.c?fmt(Math.round(c.t/c.c)):"\u2013"}</b><span class="mu">${p.c?fmt(Math.round(p.t/p.c)):"\u2013"} last month</span></div></div>
<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sales over the month" style="direction:ltr">${[0,.5,1].map(f=>`<line x1="${L}" x2="${W-8}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="#222"/><text x="${L-8}" y="${Y(mx*f)+4}" text-anchor="end" fill="#9b9b9b" font-size="11">${fk(mx*f)}</text>`).join("")}${[0,Math.floor((n-1)/2),n-1].map((i,k)=>`<text x="${X(i)}" y="${H-6}" text-anchor="${k==0?"start":k==2?"end":"middle"}" fill="#9b9b9b" font-size="11">${dt(i)}</text>`).join("")}<path d="${pth(p.a)}" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/><path d="${cur} L${X(n-1)},${Y(0)} L${X(0)},${Y(0)}Z" fill="#fff" opacity=".08"/><path d="${cur}" fill="none" stroke="#fff" stroke-width="2.5"/></svg>
<p class="mu" style="font-size:.85rem;margin:.4rem 0 2rem">Solid line: ${mname(mo)}. Dotted line: ${mname(pk)}.</p>`}
function addC(){const v=$("#nc").value.trim();if(v)run(()=>db.collection("categories").add({name:v}))}
function delC(id){run(()=>db.doc("categories/"+id).delete())}
const S2=t=>`<div style="border-top:1px solid var(--ln);margin-top:2.5rem;padding-top:1.5rem">${t}</div>`;
const bars=(e,f)=>{const mx=Math.max(1,...e.map(x=>x[1]));return e.map(([k,v])=>`<div class="br"><span>${esc(k)}</span><i style="width:${Math.max(4,v/mx*100)}%"></i><span>${f(k,v)}</span></div>`).join("")};
function sales(){
const m={},cm={};inMo(mo).forEach(o=>{m[o.item]=m[o.item]||{q:0,r:0};m[o.item].q+=o.qty;m[o.item].r+=o.total;const c=o.cat||"No category";cm[c]=(cm[c]||0)+o.total});
const top=Object.entries(m).sort((a,b)=>b[1].r-a[1].r).slice(0,6).map(([k,v])=>[k,v.r]),cats=Object.entries(cm).sort((a,b)=>b[1]-a[1]);
return mbar()+chart()+`<h3 style="margin-bottom:.8rem">Best sellers</h3>${top.length?bars(top,k=>m[k].q+" sold"):'<p class="mu">No orders in this month yet.</p>'}<h3 style="margin:2rem 0 .8rem">By category</h3>${cats.length?bars(cats,(k,v)=>fmt(v)):'<p class="mu">No sales this month.</p>'}`+S2(`<h3 style="margin-bottom:.8rem">Orders this month</h3>${PR.length?`<div class="f"><input id="oc" placeholder="Customer name"><select id="op">${PR.map(p=>`<option value="${p.id}">${esc(p.name)} (${fmt(p.price)})</option>`).join("")}</select><input id="oq" type="number" min="1" value="1" style="width:80px" aria-label="Quantity"><button class="btn" onclick="addO()">Log order</button></div>`:""}${inMo(mo).map(o=>`<div class="row"><span>${new Date(o.at).toLocaleDateString(LOC)} · ${esc(o.name)}${o.gov?" · "+esc(o.gov):""} · ${esc(o.item)}${o.size?" "+esc(o.size):""}${o.color?" "+esc(o.color):""} x${o.qty}${o.pay&&o.pay!="cod"?" · "+esc(o.pay):""}</span><span style="flex:none">${fmt(o.total)}</span><button class="btn o" onclick="run(()=>db.doc('orders/${o.id}').delete())">Delete</button></div>`).join("")||'<p class="mu">No orders yet. Customer orders appear here by themselves.</p>'}`)}
function settings(){
const n=ST.find(x=>x.key=="notice"),q=ST.find(x=>x.key=="payment")||{cod:true},s=ST.find(x=>x.key=="shipping")||{def:50,fees:{}},cf=s.fees&&s.fees.Cairo!=null?s.fees.Cairo:(s.def??50);
return`<h3 style="margin-bottom:.4rem">Notification before checkout</h3><p class="mu" style="margin-top:0">Customers see this in a pop-up when they press the order button and must tap Continue. Leave it empty to turn it off.</p><div class="f" style="flex-direction:column"><textarea id="nt" rows="4" aria-label="Notification text">${esc(n?n.text:"")}</textarea><div><button class="btn" onclick="saveN()">Save notification</button></div></div>`
+S2(`<h3 style="margin-bottom:.4rem">Offers on products</h3><p class="mu" style="margin-top:0">Offers show above the big brand name on the home page. Add a % off to lower that product's price in the store.</p>${PR.length?`<div class="f"><select id="ofp">${PR.map(p=>`<option value="${p.id}">${esc(p.name)} (${fmt(p.price)})</option>`).join("")}</select><input id="oft" placeholder="Offer text, e.g. Summer sale" style="flex:1"><input id="ofd" type="number" min="0" max="90" placeholder="% off" style="width:90px"><button class="btn" onclick="addOf()">Add offer</button></div>`:'<p class="mu">Add products first.</p>'}${OF.map(o=>{const p=PR.find(x=>x.id==o.pid);return`<div class="row"><span>${esc(p?p.name:"Deleted product")}${o.text?" · "+esc(o.text):""}${o.pct?" · "+o.pct+"% off":""}</span><button class="btn o" onclick="run(()=>db.doc('offers/${o.id}').delete())">Remove</button></div>`}).join("")||'<p class="mu">No offers yet.</p>'}`)
+S2(`<h3 style="margin-bottom:.4rem">Payment methods</h3><p class="mu" style="margin-top:0">Customers pick one at checkout. InstaPay and wallet are manual: the customer sends the money to the details below, then sends you the screenshot on WhatsApp. Leave a field empty to turn that method off.</p><div class="f" style="flex-direction:column;max-width:420px"><label style="display:flex;gap:.6rem;align-items:center"><input type="checkbox" id="pc" ${q.cod!==false?"checked":""} style="padding:0;accent-color:#fff"> Cash on delivery</label><input id="pi" placeholder="InstaPay address or number" value="${esc(q.insta||"")}" aria-label="InstaPay"><input id="pw" placeholder="Wallet number (Vodafone Cash, etc.)" value="${esc(q.wallet||"")}" aria-label="Wallet number"><input id="pn" placeholder="Wallet name, e.g. Vodafone Cash" value="${esc(q.walletName||"")}" aria-label="Wallet name"><div><button class="btn" onclick="saveP()">Save payment methods</button></div></div>`)
+S2(`<h3 style="margin-bottom:.4rem">Shipping fee</h3><p class="mu" style="margin-top:0">Cairo has its own fee. Every other governorate has the same fee.</p><div class="f" style="flex-direction:column;max-width:320px"><label class="mu">Cairo (EGP)<input id="sc" type="number" min="0" value="${cf}" style="width:100%"></label><label class="mu">All other governorates (EGP)<input id="sd" type="number" min="0" value="${s.def??50}" style="width:100%"></label><div><button class="btn" onclick="saveS()">Save shipping</button></div></div>`)}
const chipsRow=(p,k,off,label)=>`<div class="lb2">${label}</div><div>${(p[k]||[]).map((z,i)=>`<span class="tg ${(p[off]||[]).includes(z)?"off":""}"><button onclick="tg('${p.id}','${k}',${i})" aria-label="${esc(z)}: tap to mark available or unavailable">${esc(z)}</button><a href="#" onclick="rm('${p.id}','${k}',${i});return false" aria-label="Remove ${esc(z)}">×</a></span>`).join("")}<input placeholder="Add ${label.toLowerCase().slice(0,-1)}" style="width:130px;padding:.4rem" onkeydown="if(event.key==='Enter')ad('${p.id}','${k}',this)"> <button class="btn o" style="padding:.4rem .8rem" onclick="ad('${p.id}','${k}',this.previousElementSibling)">Add</button></div>`;
function products(){
const cat=sel=>`<option value="">No category</option>${CA.map(c=>`<option ${sel==c.name?"selected":""}>${esc(c.name)}</option>`).join("")}`;
return`<div class="pc"><h3 style="margin-bottom:.8rem">Add product</h3><div class="f"><input id="an" placeholder="Product name" style="flex:1;min-width:160px"><input id="ap" type="number" min="0" placeholder="Price (EGP)" style="width:140px"><select id="ac" aria-label="Category">${cat("")}</select></div><div class="f"><input id="as" placeholder="Sizes, comma separated (S, M, L)" style="flex:1;min-width:200px"><input id="aco" placeholder="Colors, comma separated (Black, White)" style="flex:1;min-width:200px"></div><div class="f" style="margin:0"><input id="ai" placeholder="Photo URL (optional)" style="flex:1;min-width:200px"><button class="btn" onclick="addP()">Add product</button></div></div>
${PR.length?"":'<p class="mu">No products yet.</p><p><button class="btn o" onclick="seed()">Load starter catalog</button></p>'}
<p class="mu" style="font-size:.85rem">Each product has its own sizes and colors. Tap a size or color to mark it unavailable (crossed out). Tap it again to make it available. Tick Sold out to hide the Add to cart button.</p>
${PR.map(p=>`<div class="pc ${p.soldOut?"so":""}"><div class="f" style="margin-bottom:.6rem"><input value="${esc(p.name)}" onchange="upd('${p.id}',{name:this.value})" aria-label="Name" style="flex:1;min-width:160px"><input type="number" min="0" value="${p.price}" onchange="upd('${p.id}',{price:+this.value})" aria-label="Price in EGP" style="width:120px"><select onchange="upd('${p.id}',{cat:this.value})" aria-label="Category">${cat(p.cat)}</select></div><input placeholder="Photo URL" value="${esc(p.img||"")}" onchange="upd('${p.id}',{img:this.value})" aria-label="Photo URL" style="width:100%">${chipsRow(p,"sizes","offSizes","Sizes")}${chipsRow(p,"colors","offColors","Colors")}<div class="row" style="border:0;padding:1rem 0 0;justify-content:space-between"><label style="display:flex;gap:.6rem;align-items:center"><input type="checkbox" ${p.soldOut?"checked":""} onchange="upd('${p.id}',{soldOut:this.checked})" style="padding:0;accent-color:#fff"> Sold out</label><button class="btn o" onclick="if(confirm(tr('Delete this product?')))run(()=>db.doc('products/${p.id}').delete())">Delete product</button></div></div>`).join("")}`
+S2(`<h3 style="margin-bottom:.8rem">Categories</h3><div class="f"><input id="nc" placeholder="New category name"><button class="btn" onclick="addC()">Add category</button></div><div class="f">${CA.map(c=>`<span class="btn o" style="cursor:default">${esc(c.name)} <a href="#" onclick="delC('${c.id}');return false" aria-label="Delete category" style="margin-left:.5rem">×</a></span>`).join("")||'<span class="mu">No categories yet.</span>'}</div>`)}
function render(){
const tabs=`<div class="tabs">${[["sales","Sales"],["settings","Notes, offers & payment"],["products","Products"]].map(([k,l])=>`<button class="btn ${tab==k?"":"o"}" onclick="tab='${k}';render()">${l}</button>`).join("")}</div>`;
app.innerHTML=tabs+({sales,settings,products}[tab]||sales)()}
const prod=id=>PR.find(x=>x.id==id);
const upd=(id,o)=>run(()=>db.doc("products/"+id).update(o));
function tg(id,k,i){const p=prod(id),n=(p[k]||[])[i],ok=k=="sizes"?"offSizes":"offColors",off=p[ok]||[];upd(id,{[ok]:off.includes(n)?off.filter(x=>x!=n):[...off,n]})}
function rm(id,k,i){const p=prod(id),a=[...(p[k]||[])],n=a.splice(i,1)[0],ok=k=="sizes"?"offSizes":"offColors";upd(id,{[k]:a,[ok]:(p[ok]||[]).filter(x=>x!=n)})}
function ad(id,k,inp){const v=inp.value.trim();if(!v)return;const a=prod(id)[k]||[];if(a.includes(v)){toast("Already added");return}upd(id,{[k]:[...a,v]})}
function addP(){const g=i=>$(i).value.trim(),l=s=>g(s).split(",").map(x=>x.trim()).filter(Boolean),n=g("#an"),pr=+g("#ap");if(!n||!(pr>0)){toast("Enter the product name and price");return}run(()=>db.collection("products").add({name:n,price:pr,cat:$("#ac").value,sizes:l("#as"),colors:l("#aco"),img:g("#ai")}))}
function saveS(){const o={key:"shipping",def:Math.max(0,+$("#sd").value||0),fees:{Cairo:Math.max(0,+$("#sc").value||0)}},n=ST.find(x=>x.key=="shipping");run(()=>n?db.doc("settings/"+n.id).update(o):db.collection("settings").add(o)).then(()=>toast("Saved"))}
function saveP(){const o={key:"payment",cod:$("#pc").checked,insta:$("#pi").value.trim(),wallet:$("#pw").value.trim(),walletName:$("#pn").value.trim()},n=ST.find(x=>x.key=="payment");run(()=>n?db.doc("settings/"+n.id).update(o):db.collection("settings").add(o)).then(()=>toast("Saved"))}
function addOf(){const pid=$("#ofp").value,t=$("#oft").value.trim(),d=Math.max(0,Math.min(90,+$("#ofd").value||0));if(!t&&!d){toast("Write the offer text or a discount");return}run(()=>db.collection("offers").add({pid,text:t,pct:d}))}
function saveN(){const t=$("#nt").value.trim(),n=ST.find(x=>x.key=="notice");run(()=>n?db.doc("settings/"+n.id).update({text:t}):db.collection("settings").add({key:"notice",text:t})).then(()=>toast("Saved"))}
function addO(){const p=prod($("#op").value),q=Math.max(1,+$("#oq").value||1);run(()=>db.collection("orders").add({name:$("#oc").value.trim()||"Customer",item:p.name,qty:q,total:p.price*q,at:Date.now(),cat:p.cat||""}))}
function seed(){run(async()=>{for(const[n,p]of DEF)await db.collection("products").add({name:n,price:p,sizes:["S","M","L","XL"],colors:[]})})}
let PIN="",_c=null,_t=0;
const getBin=async()=>{const x=await fetch("/api/data",{headers:{"x-pin":PIN}});if(!x.ok)throw new Error("Wrong PIN or setup missing");const r=await x.json();["products","orders","categories","offers","settings"].forEach(k=>r[k]=r[k]||[]);return r};
const putBin=async r=>{_c=null;const x=await fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json","x-pin":PIN},body:JSON.stringify(r)});if(!x.ok)throw new Error("Save failed ("+x.status+")")};
const getC=async()=>{if(!_c||Date.now()-_t>800){_t=Date.now();_c=getBin()}return _c};
const rid=()=>"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
db={collection:k=>({async get(){const r=await getC();return{docs:r[k].map(d=>({id:d.id,data:()=>{const{id,...x}=d;return x}}))}},async add(o){const r=await getBin();r[k].push({id:rid(),...o});await putBin(r)}}),
doc:path=>{const[k,id]=path.split("/");return{async update(o){const r=await getBin();const d=r[k].find(x=>x.id==id);if(d)Object.assign(d,o);await putBin(r)},async delete(){const r=await getBin();r[k]=r[k].filter(x=>x.id!=id);await putBin(r)}}}};
if(LG)(async()=>{PIN=sessionStorage.getItem("np")||prompt(tr("Enter admin PIN"))||"";try{await getBin();sessionStorage.setItem("np",PIN);load()}catch(e){sessionStorage.removeItem("np");app.innerHTML="<p>Wrong PIN, or the Vercel environment variables are missing.</p>"}})();
</script></body></html>
