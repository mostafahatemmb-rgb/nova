<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nova Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--mu:#9b9b9b;--ln:#2a2a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}body{margin:0;background:#000;color:#fff;font:400 16px/1.5 Manrope,system-ui,sans-serif;padding:1.5rem 5vw 4rem;max-width:960px;margin-inline:auto}
h1,h2,h3{font-family:Syne,Impact,sans-serif;margin:0}h1{letter-spacing:.3em;font-size:1.5rem}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ln);padding-bottom:1rem;margin-bottom:1.5rem}
.btn{background:#fff;color:#000;border:1px solid #fff;padding:.6rem 1.1rem;font:600 .9rem Manrope,sans-serif;cursor:pointer}.btn.o{background:none;color:#fff}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
input,select{background:#000;color:#fff;border:1px solid #444;padding:.6rem;font:inherit;border-radius:0;min-width:0}
.tabs{display:flex;gap:.6rem;margin-bottom:1.5rem;flex-wrap:wrap}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem}.st div{border:1px solid var(--ln);padding:1.1rem}.st b{display:block;font:800 1.6rem Syne,sans-serif}
.br{display:grid;grid-template-columns:150px 1fr 110px;gap:.8rem;align-items:center;margin:.5rem 0;font-size:.9rem}.br i{display:block;height:10px;background:#fff}
.row{display:flex;gap:.6rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--ln)}.row input:first-child,.row span:first-child{flex:1}.row input[type=number]{width:110px}
.f{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.5rem}.mu{color:var(--mu)}
.tb{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:.7rem 1.2rem;font-weight:600}
</style></head><body>
<div class="top"><h1>NOVA ADMIN</h1><span class="mu">Private</span></div>
<div id="app"><p class="mu">Loading…</p></div>
<script>
const DEF=[["Black Overshirt",1290],["Classic Tee",450],["Slim Chinos",890],["Knit Polo",650],["Zip Hoodie",1090],["Denim Jacket",1490],["Linen Shirt",790],["Bomber Jacket",1390]];
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const fmt=n=>Number(n).toLocaleString("en-US")+" EGP";
let db,PR=[],OR=[],CA=[],mo=null,tab="sales";
function toast(m){const t=document.createElement("div");t.className="tb";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
async function load(){const a=await db.collection("products").get(),b=await db.collection("orders").get(),cc=await db.collection("categories").get();CA=cc.docs.map(d=>({id:d.id,...d.data()}));mo=mo||mk(Date.now());
PR=a.docs.map(d=>({id:d.id,...d.data()}));OR=b.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>y.at-x.at);render()}
async function run(f){try{await f();await load()}catch(e){toast("Could not save: "+(e.message||e.code))}}
const fk=n=>n>=1000?(n/1000)+"K":n;
const mk=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const mname=k=>new Date(k+"-01T12:00:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"});
const inMo=k=>OR.filter(o=>mk(o.at)==k);
const pm=k=>{const[y,m]=k.split("-").map(Number);return mk(new Date(y,m-2,1))};
function months(){return[...new Set([mk(Date.now()),...OR.map(o=>mk(o.at))])].sort().reverse()}
function mbar(){return`<div class="f"><select onchange="mo=this.value;render()" aria-label="Month">${months().map(k=>`<option value="${k}" ${k==mo?"selected":""}>${mname(k)}${k==mk(Date.now())?" (current)":""}</option>`).join("")}</select><span class="mu" style="align-self:center">Resets on the 1st of every month. Pick a past month to see its history.</span></div>`}
function chart(){
const[y,m]=mo.split("-").map(Number),n=new Date(y,m,0).getDate(),pk=pm(mo);
const bk=k=>{const a=Array(n).fill(0);let c=0,t=0;inMo(k).forEach(o=>{const i=new Date(o.at).getDate()-1;if(i<n)a[i]+=o.total;c++;t+=o.total});return{a,c,t}};
const c=bk(mo),p=bk(pk),W=640,H=220,L=48,T=12,B=26,mg=Math.max(...c.a,...p.a,1),mag=10**Math.floor(Math.log10(mg)),mx=Math.ceil(mg/mag)*mag;
const X=i=>L+i*(W-L-8)/(n-1),Y=v=>T+(1-v/mx)*(H-T-B),cl=y=>Math.min(y,H-B);
const pth=a=>{const q=a.map((v,i)=>[X(i),Y(v)]);let d="M"+q[0];for(let i=0;i<q.length-1;i++){const a0=q[i-1]||q[i],a1=q[i],a2=q[i+1],a3=q[i+2]||a2;d+=`C${a1[0]+(a2[0]-a0[0])/6},${cl(a1[1]+(a2[1]-a0[1])/6)} ${a2[0]-(a3[0]-a1[0])/6},${cl(a2[1]-(a3[1]-a1[1])/6)} ${a2}`}return d};
const ch=p.t?Math.round((c.t-p.t)/p.t*100):null,cur=pth(c.a),mn=new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"short"}),dt=i=>(i+1)+" "+mn;
return `<div class="st"><div><span class="mu">Total sales</span><b>${fmt(c.t)}</b><span style="color:${ch==null?"var(--mu)":ch>=0?"#3ecf8e":"#ff6b6b"}">${ch==null?"No previous month yet":(ch>=0?"\u2197 ":"\u2198 ")+Math.abs(ch)+"% vs last month"}</span></div><div><span class="mu">Total orders</span><b>${c.c}</b><span class="mu">${p.c} last month</span></div><div><span class="mu">Average order</span><b>${c.c?fmt(Math.round(c.t/c.c)):"\u2013"}</b><span class="mu">${p.c?fmt(Math.round(p.t/p.c)):"\u2013"} last month</span></div></div>
<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sales over the month">${[0,.5,1].map(f=>`<line x1="${L}" x2="${W-8}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="#222"/><text x="${L-8}" y="${Y(mx*f)+4}" text-anchor="end" fill="#9b9b9b" font-size="11">${fk(mx*f)}</text>`).join("")}${[0,Math.floor((n-1)/2),n-1].map((i,k)=>`<text x="${X(i)}" y="${H-6}" text-anchor="${k==0?"start":k==2?"end":"middle"}" fill="#9b9b9b" font-size="11">${dt(i)}</text>`).join("")}<path d="${pth(p.a)}" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/><path d="${cur} L${X(n-1)},${Y(0)} L${X(0)},${Y(0)}Z" fill="#fff" opacity=".08"/><path d="${cur}" fill="none" stroke="#fff" stroke-width="2.5"/></svg>
<p class="mu" style="font-size:.85rem;margin:.4rem 0 2rem">Solid line: ${mname(mo)}. Dotted line: ${mname(pk)}.</p>`}
function addC(){const v=$("#nc").value.trim();if(v)run(()=>db.collection("categories").add({name:v}))}
function delC(id){run(()=>db.doc("categories/"+id).delete())}
function render(){
const tabs=`<div class="tabs">${[["sales","Sales analysis"],["orders","Orders"],["cat","Catalog"]].map(([k,l])=>`<button class="btn ${tab==k?"":"o"}" onclick="tab='${k}';render()">${l}</button>`).join("")}</div>`;
let h="";
if(tab=="sales"){const r=OR.reduce((a,o)=>a+o.total,0),m={};const cm={};inMo(mo).forEach(o=>{m[o.item]=m[o.item]||{q:0,r:0};m[o.item].q+=o.qty;m[o.item].r+=o.total;const c=o.cat||"No category";cm[c]=(cm[c]||0)+o.total});
const top=Object.entries(m).sort((a,b)=>b[1].r-a[1].r).slice(0,6),mx=top.length?top[0][1].r:1;
h=chart()+`<h3 style="margin-bottom:.8rem">Best sellers</h3>${top.length?top.map(([k,v])=>`<div class="br"><span>${esc(k)}</span><i style="width:${Math.max(4,v.r/mx*100)}%"></i><span>${v.q} sold</span></div>`).join(""):'<p class="mu">No orders in this month yet. Log each WhatsApp order in the Orders tab.</p>'}<h3 style="margin:2rem 0 .8rem">By category</h3>${Object.entries(cm).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="br"><span>${esc(k)}</span><i style="width:${Math.max(4,v/Math.max(...Object.values(cm))*100)}%"></i><span>${fmt(v)}</span></div>`).join("")||'<p class="mu">No sales this month.</p>'}`}
if(tab=="orders")h=`<h3 style="margin-bottom:.8rem">Log an order</h3>${PR.length?`<div class="f"><input id="oc" placeholder="Customer name"><select id="op">${PR.map(p=>`<option value="${p.id}">${esc(p.name)} (${fmt(p.price)})</option>`).join("")}</select><input id="oq" type="number" min="1" value="1" style="width:80px" aria-label="Quantity"><button class="btn" onclick="addO()">Add order</button></div>`:'<p class="mu">Add products in the Catalog tab first.</p>'}${inMo(mo).map(o=>`<div class="row"><span>${new Date(o.at).toLocaleDateString("en-GB")} · ${esc(o.name)} · ${esc(o.item)} x${o.qty}</span><span style="flex:none">${fmt(o.total)}</span><button class="btn o" onclick="run(()=>db.doc('orders/${o.id}').delete())">Delete</button></div>`).join("")}`;
if(tab=="cat")h=`<h3 style="margin-bottom:.8rem">Categories</h3><div class="f"><input id="nc" placeholder="New category name"><button class="btn" onclick="addC()">Add category</button></div><div class="f">${CA.map(c=>`<span class="btn o" style="cursor:default">${esc(c.name)} <a href="#" onclick="delC('${c.id}');return false" aria-label="Delete category" style="margin-left:.5rem">×</a></span>`).join("")||'<span class="mu">No categories yet.</span>'}</div><h3 style="margin-bottom:.8rem">Products</h3>${PR.length?"":'<p class="mu">Your catalog is empty.</p><p><button class="btn" onclick="seed()">Load starter catalog</button></p>'}${PR.map(p=>`<div class="row"><input value="${esc(p.name)}" onchange="run(()=>db.doc('products/${p.id}').update({name:this.value}))" aria-label="Name"><input type="number" value="${p.price}" onchange="run(()=>db.doc('products/${p.id}').update({price:+this.value}))" aria-label="Price in EGP"><select onchange="run(()=>db.doc('products/${p.id}').update({cat:this.value}))" aria-label="Category"><option value="">No category</option>${CA.map(c=>`<option ${p.cat==c.name?"selected":""}>${esc(c.name)}</option>`).join("")}</select><button class="btn o" onclick="run(()=>db.doc('products/${p.id}').delete())">Delete</button></div>`).join("")}<p><button class="btn" onclick="run(()=>db.collection('products').add({name:'New item',price:500}))">Add product</button> <button class="btn o" onclick="copyCat()">Copy catalog for the store</button></p>`;
app.innerHTML=tabs+(tab=="cat"?"":mbar())+h}
function addO(){const p=PR.find(x=>x.id==$("#op").value),q=Math.max(1,+$("#oq").value||1);run(()=>db.collection("orders").add({name:$("#oc").value.trim()||"Customer",item:p.name,qty:q,total:p.price*q,at:Date.now(),cat:p.cat||""}))}
function seed(){run(async()=>{for(const[n,p]of DEF)await db.collection("products").add({name:n,price:p})})}
async function copyCat(){try{await navigator.clipboard.writeText(JSON.stringify(PR.map(p=>({name:p.name,price:p.price,category:p.cat||""}))));toast("Catalog copied. Send it to Claude to update the store.")}catch(e){toast("Copy failed")}}
(async()=>{const u=await claude.use("user");db=await claude.use("db");
if(!db){app.innerHTML='<p>Sign in to Claude to open the admin panel.</p>';return}
if(u&&!u.isOwner()&&!u.canEdit()){app.innerHTML="<p>This panel is for the Nova admin only.</p>";return}
load()})();
</script></body></html>
