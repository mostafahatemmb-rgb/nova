<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--mu:#9b9b9b;--ln:#2a2a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:#000;color:#fff;font:400 16px/1.5 Manrope,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#000;z-index:10}
h1,h2,h3,.logo{font-family:Syne,Impact,sans-serif;margin:0}
a{color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:#000;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:1rem 5vw}
.logo{font-size:1.6rem;font-weight:800;letter-spacing:.3em;text-decoration:none}
nav{display:flex;gap:1.6rem}nav a{text-decoration:none;font-weight:600;color:var(--mu)}nav a:hover,nav a.on{color:#fff}
.bar{background:#fff;color:#000;text-align:center;font-weight:600;font-size:.85rem;padding:.5rem}
main{min-height:70vh}.w{padding:4rem 5vw}
.hero{padding:5vh 5vw 6vh;overflow:hidden}
.hero .logo{display:block;font-size:clamp(4.5rem,27vw,24rem);line-height:.85;letter-spacing:-.02em;animation:tight 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes tight{from{letter-spacing:.35em;opacity:0}to{letter-spacing:-.02em;opacity:1}}
.hero p{max-width:30ch;font-size:1.25rem;margin:2rem 0}
.btn{background:#fff;color:#000;border:1px solid #fff;padding:.85rem 1.5rem;font:600 .95rem Manrope,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.o{background:none;color:#fff}.btn:hover{opacity:.85}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:var(--ln);border-block:1px solid var(--ln)}
.cats a{background:#000;padding:4rem 1.5rem;text-decoration:none;font:700 1.6rem Syne,sans-serif}.cats a:hover{background:#fff;color:#000}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2rem}.hd h2{font-size:2rem}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2rem 1.2rem}
.ph{aspect-ratio:3/4;background:linear-gradient(160deg,#222,#050505);display:grid;place-items:center;overflow:hidden;margin-bottom:.8rem}
.ph span{font:800 6rem Syne,sans-serif}.ph img{width:100%;height:100%;object-fit:cover}
.card h3{font:600 1rem Manrope,sans-serif}.card p{margin:.1rem 0 .7rem;color:var(--mu)}
.r{display:flex;gap:.5rem}.r .btn{flex:1;padding:.7rem .5rem}
input,select{background:#000;color:#fff;border:1px solid #444;padding:.7rem;font:inherit;width:100%;border-radius:0}
select{width:auto}
.perks{display:flex;flex-wrap:wrap;gap:1rem 3rem;padding:1.5rem 5vw;border-top:1px solid var(--ln);color:var(--mu)}
footer{border-top:1px solid var(--ln);padding:2rem 5vw;color:var(--mu);display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.cl{display:grid;grid-template-columns:1fr 340px;gap:3rem}@media(max-width:800px){.cl{grid-template-columns:1fr}nav{gap:1rem}}
.it{display:flex;gap:1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--ln)}.it .ph{width:70px;margin:0;flex:none}.it .ph span{font-size:2rem}.it div:nth-child(2){flex:1}
.q{display:flex;align-items:center;gap:.6rem}.q button{background:none;color:#fff;border:1px solid #444;width:2rem;height:2rem;cursor:pointer}
.f{display:grid;gap:.7rem}.tot{display:flex;justify-content:space-between;font:700 1.3rem Syne,sans-serif;margin:1rem 0}
.tabs{display:flex;gap:1rem;margin-bottom:2rem}.tabs .btn{padding:.6rem 1.1rem}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem}.st div{border:1px solid var(--ln);padding:1.2rem}.st b{display:block;font:800 1.7rem Syne,sans-serif}
.br{display:grid;grid-template-columns:150px 1fr 110px;gap:.8rem;align-items:center;margin:.5rem 0;font-size:.9rem}.br i{display:block;height:10px;background:#fff}
.ar{display:grid;grid-template-columns:60px 1fr 110px auto;gap:.6rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--ln)}.ar .ph{margin:0}.ar .ph span{font-size:1.5rem}
.tb{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:.7rem 1.2rem;font-weight:600;z-index:20}
@media(prefers-reduced-motion:reduce){.hero .logo{animation:none}}
</style></head><body>
<div class="bar">Cash on delivery · Orders confirmed on WhatsApp</div>
<header><a class="logo" href="#home">NOVA</a><nav id="nav"></nav></header>
<main id="app"></main>
<footer><span>© Nova. All rights reserved.</span></footer>
<script>
const DEF=[
{id:1,name:"Black Overshirt",price:1290},{id:2,name:"Classic Tee",price:450},{id:3,name:"Slim Chinos",price:890},{id:4,name:"Knit Polo",price:650},
{id:5,name:"Zip Hoodie",price:1090},{id:6,name:"Denim Jacket",price:1490},{id:7,name:"Linen Shirt",price:790},{id:8,name:"Bomber Jacket",price:1390}];
const PIN="1234",SZ=["S","M","L","XL"];
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Storage is full. Use a smaller photo.")}};
let P=DEF,C=ld("nv_c",[]),O=ld("nv_o",[]),W="201000000000",done=false;
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const fmt=n=>Number(n).toLocaleString("en-US")+" EGP";
const cnt=()=>C.reduce((a,i)=>a+i.q,0),tot=()=>C.reduce((a,i)=>a+i.q*i.price,0);
function toast(m){const t=document.createElement("div");t.className="tb";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
const img=p=>p.img?`<img src="${p.img}" alt="${esc(p.name)}">`:`<span>${esc(p.name[0])}</span>`;
const card=p=>`<article class="card"><div class="ph">${img(p)}</div><h3>${esc(p.name)}</h3><p>${fmt(p.price)}</p><div class="r"><select id="s${p.id}" aria-label="Size">${SZ.map(s=>`<option>${s}</option>`).join("")}</select><button class="btn" onclick="add(${p.id})">Add to cart</button></div></article>`;
function add(id){const p=P.find(x=>x.id==id),s=$("#s"+id).value,i=C.find(x=>x.id==id&&x.size==s);
i?i.q++:C.push({id:p.id,name:p.name,price:p.price,img:p.img||"",size:s,q:1});sv("nv_c",C);nav();toast("Added to cart")}
function nav(){const h=location.hash.slice(1)||"home";$("#nav").innerHTML=[["home","Home"],["shop","Shop"],["cart","Cart ("+cnt()+")"]].map(([k,l])=>`<a href="#${k}" class="${h==k?"on":""}">${l}</a>`).join("")}
function home(){return`<section class="hero"><span class="logo">NOVA</span><p>Clean black essentials for men. Made to look expensive, priced to wear every day.</p><a class="btn" href="#shop">Shop now</a></section>
<div class="cats"><a href="#shop">T-shirts and polos</a><a href="#shop">Shirts and chinos</a><a href="#shop">Jackets and hoodies</a></div>
<section class="w"><div class="hd"><h2>New in</h2><a href="#shop">View all</a></div><div class="g">${P.slice(0,4).map(card).join("")}</div></section>`}
const shop=()=>`<section class="w"><div class="hd"><h2>Shop all</h2><span>${P.length} items</span></div><div class="g">${P.map(card).join("")}</div></section>`;
function cart(){
if(done)return`<section class="w"><h2>Thank you</h2><p>Your order was sent on WhatsApp. We will confirm it with you shortly.</p><a class="btn" href="#shop" onclick="done=false">Keep shopping</a></section>`;
if(!C.length)return`<section class="w"><h2>Your cart is empty</h2><p style="color:var(--mu)">Add something from the shop to start your order.</p><a class="btn" href="#shop">Go to shop</a></section>`;
return`<section class="w"><h2 style="margin-bottom:2rem">Cart</h2><div class="cl"><div>${C.map((i,n)=>`<div class="it"><div class="ph">${img(i)}</div><div><b>${esc(i.name)}</b><br><span style="color:var(--mu)">Size ${i.size} · ${fmt(i.price)}</span></div><div class="q"><button onclick="qty(${n},-1)" aria-label="Less">−</button>${i.q}<button onclick="qty(${n},1)" aria-label="More">+</button></div></div>`).join("")}</div>
<div><h3 style="margin-bottom:1rem">Delivery details</h3><div class="f"><input id="cn" placeholder="Full name" autocomplete="name"><input id="cp" placeholder="Phone number" type="tel" autocomplete="tel"><input id="cc" placeholder="City"><input id="ca" placeholder="Full address" autocomplete="street-address"></div>
<div class="tot"><span>Total</span><span>${fmt(tot())}</span></div><button class="btn" style="width:100%" onclick="order()">Send order on WhatsApp</button><p style="color:var(--mu);font-size:.85rem">Pay when your order arrives.</p></div></div></section>`}
function qty(n,d){C[n].q+=d;if(C[n].q<1)C.splice(n,1);sv("nv_c",C);render()}
function order(){const v=i=>$(i).value.trim(),n=v("#cn"),p=v("#cp"),c=v("#cc"),a=v("#ca");
if(!n||!p||!c||!a){toast("Fill in all delivery details");return}
const lines=C.map(i=>`• ${i.name} (${i.size}) x${i.q} = ${fmt(i.q*i.price)}`).join("\n");
const msg=`New Nova order\n${lines}\nTotal: ${fmt(tot())}\n\nName: ${n}\nPhone: ${p}\nCity: ${c}\nAddress: ${a}`;

C=[];sv("nv_c",C);done=true;window.open("https://wa.me/"+W+"?text="+encodeURIComponent(msg),"_blank");render()}
function render(){const h=location.hash.slice(1)||"home";app.innerHTML=({home,shop,cart}[h]||home)();nav()}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});render();
</script></body></html>
